name: Build and Release

on:
  push:
    branches: [ main, dev ]
  pull_request:
  workflow_dispatch: {}

jobs:
  # Next release version as year.month.build (e.g. 2026.11.1); build resets each month.
  # Read-only: the tag is only created by `release` once the exe has built and passed.
  version:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute next version
        id: compute
        run: |
          YEAR_MONTH=$(date -u +'%Y.%-m')
          ESCAPED=$(printf '%s' "$YEAR_MONTH" | sed 's/\./\\./g')
          LAST=$(git tag --list "${YEAR_MONTH}.*" | sed -E "s/^${ESCAPED}\.//" | sort -n | tail -1)
          NEXT=$(( ${LAST:-0} + 1 ))
          VERSION="${YEAR_MONTH}.${NEXT}"
          echo "Computed version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build_exe:
    needs: version
    # Runs on dev/PR builds too, where `version` is skipped rather than failed.
    if: always() && (needs.version.result == 'success' || needs.version.result == 'skipped')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up .NET (builds DepotDownloader)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Stamp version
        if: needs.version.outputs.version != ''
        shell: pwsh
        run: |
          $v = "${{ needs.version.outputs.version }}"
          Set-Content lore/__init__.py "__version__ = `"$v`"  # set by the build" -Encoding utf8

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build exe
        shell: pwsh
        run: ./build.ps1

      - name: Smoke-test --version
        shell: pwsh
        run: |
          $out = & ./dist/lore.exe --version
          if ($LASTEXITCODE -ne 0) { throw "exit code $LASTEXITCODE" }
          Write-Host $out
          $expected = "${{ needs.version.outputs.version }}"
          if ($expected -and $out -notmatch [regex]::Escape($expected)) { throw "expected version $expected" }

      - name: Smoke-test Epic/GOG database
        shell: pwsh
        run: |
          & ./dist/lore.exe stats --db "$env:RUNNER_TEMP/smoke.sqlite"
          if ($LASTEXITCODE -ne 0) { throw "stats failed" }

      - name: Check DepotDownloader and pycryptodomex are embedded
        shell: pwsh
        run: |
          $listing = (python -m PyInstaller.utils.cliutils.archive_viewer --list ./dist/lore.exe) -join "`n"
          if ($listing -notmatch 'DepotDownloader[\\/]+DepotDownloader\.exe') { throw "DepotDownloader.exe not embedded" }
          if ($listing -notmatch 'Cryptodome') { throw "pycryptodomex not bundled" }
          Write-Host "OK"

      - uses: actions/upload-artifact@v4
        with:
          name: lore
          path: dist/lore.exe
          if-no-files-found: error

  release:
    needs: [version, build_exe]
    if: >
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      needs.version.result == 'success' &&
      needs.build_exe.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lore
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: dist/lore.exe
